context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-taq
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/lib/q/mod/kx
    - cp -r taq $PREFIX/lib/q/mod/kx/

requirements:
  run:
    - q-kx-log

about:
  homepage: https://github.com/KxSystems/taq
  repository: https://github.com/KxSystems/taq
  documentation: https://github.com/KxSystems/taq/blob/main/docs/reference.md
  license: Apache-2.0
  license_file: LICENSE
  summary: Parses NYSE TAQ psv files and persists the result in kdb+ format.
  description: >-
    The kdb-x taq module parses NYSE TAQ psv files and persists result in kdb+ format.

tests:
  - script:
    - test -f ${PREFIX}/lib/q/mod/kx/taq/converters.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/init.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/inputSchema.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/dbservice/init.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/dbservice/master.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/dbservice/trade.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/dbservice/quote.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/q/init.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/q/master.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/q/trade.q
    - test -f ${PREFIX}/lib/q/mod/kx/taq/schemas/q/quote.q
