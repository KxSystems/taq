    type: char
  - name: retailInterestIndicator
    type: char
  - name: shortSaleRestrictionIndicator
    type: char
  - name: LULDBBOIndicator
    type: char
  - name: SIPGeneratedMessageIdentifier
    type: char
  - name: nationalBBOLULDIndicator
    type: char
